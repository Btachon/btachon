openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Auth operations
  - name: profile
    description: User profile operations
  - name: friends
    description: Friends and social operations
  - name: videos
    description: Video content management
  - name: tutors
    description: Tutor directory operations
  - name: notifications
    description: In-app notification operations
  - name: learn
    description: Learn sessions (Lishma and study groups)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current auth user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange mobile auth code for session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeBody"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeResponse"

  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Log out mobile session
      responses:
        "200":
          description: Logout success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutMobileSessionResponse"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Create or update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: Get friend list for current user
      responses:
        "200":
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendEntry"
        "401":
          description: Unauthorized

  /friends/add:
    post:
      operationId: addFriendByCode
      tags: [friends]
      summary: Add a friend by their share code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendBody"
      responses:
        "200":
          description: Friend added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendEntry"
        "400":
          description: Invalid code or already friends
        "401":
          description: Unauthorized

  /friends/{friendUserId}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      parameters:
        - name: friendUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Friend removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /friend-requests:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a growth challenge or Tehillim request to a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "200":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestEntry"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized

  /friend-requests/incoming:
    get:
      operationId: getIncomingFriendRequests
      tags: [friends]
      summary: Get pending incoming friend requests
      responses:
        "200":
          description: List of incoming requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequestEntry"
        "401":
          description: Unauthorized

  /friend-requests/outgoing:
    get:
      operationId: getOutgoingFriendRequests
      tags: [friends]
      summary: Get outgoing friend requests
      responses:
        "200":
          description: List of outgoing requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequestEntry"
        "401":
          description: Unauthorized

  /friend-requests/{requestId}:
    patch:
      operationId: respondToFriendRequest
      tags: [friends]
      summary: Accept or decline a friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToFriendRequestBody"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestEntry"
        "401":
          description: Unauthorized
        "404":
          description: Request not found

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List all videos
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: isShort
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoEntry"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Add or update a video (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoBody"
      responses:
        "200":
          description: Created or updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoEntry"
        "401":
          description: Unauthorized

  /tutors:
    get:
      operationId: listTutors
      tags: [tutors]
      summary: List all available tutors
      responses:
        "200":
          description: List of tutors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorEntry"
    post:
      operationId: registerAsTutor
      tags: [tutors]
      summary: Register yourself as a tutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAsTutorBody"
      responses:
        "200":
          description: Tutor profile created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorEntry"
        "401":
          description: Unauthorized

  /tutors/me:
    delete:
      operationId: removeTutorListing
      tags: [tutors]
      summary: Remove your own tutor listing
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /tutors/{tutorId}/contact:
    post:
      operationId: contactTutor
      tags: [tutors]
      summary: Send a contact message to a tutor
      parameters:
        - name: tutorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactTutorBody"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get the current user's notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationEntry"
        "401":
          description: Unauthorized

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /notifications/{id}/accept:
    post:
      operationId: acceptNotification
      tags: [notifications]
      summary: Accept a tutor contact request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /notifications/{id}/decline:
    post:
      operationId: declineNotification
      tags: [notifications]
      summary: Decline a tutor contact request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

  /learn-sessions:
    get:
      operationId: listLearnSessions
      tags: [learn]
      summary: List all learn sessions
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnSessionEntry"
    post:
      operationId: createLearnSession
      tags: [learn]
      summary: Create a learn session or tutor request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearnSessionBody"
      responses:
        "200":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnSessionEntry"
        "401":
          description: Unauthorized

  /learn-sessions/{id}/respond:
    post:
      operationId: respondToLearnSession
      tags: [learn]
      summary: Tutor responds to a student learning request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToLearnSessionBody"
      responses:
        "200":
          description: Response sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "404":
          description: Session not found

  /videos/{videoId}:
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video (admin)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required:
        - id

    GetCurrentAuthUserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    ExchangeMobileAuthorizationCodeBody:
      type: object
      properties:
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
        nonce:
          type: ["string", "null"]
      required:
        - code
        - code_verifier
        - redirect_uri
        - state

    ExchangeMobileAuthorizationCodeResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    LogoutMobileSessionResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: ["string", "null"]
        shabbosCity:
          type: ["string", "null"]
        onboardingComplete:
          type: boolean
        shareCode:
          type: string
        bio:
          type: ["string", "null"]
        hobbies:
          type: ["string", "null"]
        growthGoals:
          type: ["string", "null"]
      required:
        - userId
        - onboardingComplete
        - shareCode

    UpsertProfileBody:
      type: object
      properties:
        displayName:
          type: ["string", "null"]
        shabbosCity:
          type: ["string", "null"]
        onboardingComplete:
          type: boolean
        bio:
          type: ["string", "null"]
        hobbies:
          type: ["string", "null"]
        growthGoals:
          type: ["string", "null"]
        zoomLink:
          type: ["string", "null"]

    FriendEntry:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        shareCode:
          type: string
      required:
        - userId
        - shareCode

    AddFriendBody:
      type: object
      properties:
        shareCode:
          type: string
      required:
        - shareCode

    SendFriendRequestBody:
      type: object
      properties:
        toUserId:
          type: string
        type:
          type: string
          enum: [challenge, tehillim]
        message:
          type: ["string", "null"]
      required:
        - toUserId
        - type

    RespondToFriendRequestBody:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, declined]
      required:
        - status

    FriendRequestEntry:
      type: object
      properties:
        id:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        type:
          type: string
        message:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
        fromDisplayName:
          type: ["string", "null"]
        fromFirstName:
          type: ["string", "null"]
        fromProfileImageUrl:
          type: ["string", "null"]
        toDisplayName:
          type: ["string", "null"]
        toFirstName:
          type: ["string", "null"]
        toProfileImageUrl:
          type: ["string", "null"]
      required:
        - id
        - fromUserId
        - toUserId
        - type
        - status
        - createdAt

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    VideoEntry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        speaker:
          type: string
        channel:
          type: string
        duration:
          type: string
        category:
          type: string
        description:
          type: string
        isShort:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - speaker
        - channel
        - duration
        - category
        - description
        - isShort
        - sortOrder

    TutorEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: ["string", "null"]
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        subjects:
          type: string
        languages:
          type: string
        availability:
          type: string
        profileImageUrl:
          type: ["string", "null"]
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - displayName
        - subjects
        - languages
        - availability
        - isAvailable
        - isFeatured
        - createdAt

    RegisterAsTutorBody:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: ["string", "null"]
        subjects:
          type: string
        languages:
          type: string
        availability:
          type: string
      required:
        - displayName
        - subjects
        - languages
        - availability

    ContactTutorBody:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    NotificationEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        isRead:
          type: boolean
        status:
          type: string
        fromUserId:
          type: ["string", "null"]
        fromName:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - type
        - title
        - isRead
        - status
        - createdAt

    LearnSessionEntry:
      type: object
      properties:
        id:
          type: string
        hostUserId:
          type: string
        type:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        topic:
          type: ["string", "null"]
        level:
          type: string
        format:
          type: string
        date:
          type: ["string", "null"]
        time:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        capacity:
          type: integer
        hostName:
          type: string
        createdAt:
          type: string
      required:
        - id
        - hostUserId
        - type
        - title
        - level
        - format
        - capacity
        - hostName
        - createdAt

    RespondToLearnSessionBody:
      type: object
      properties:
        message:
          type: ["string", "null"]

    CreateLearnSessionBody:
      type: object
      properties:
        type:
          type: string
          enum: [lishma, study, request]
        title:
          type: string
        description:
          type: ["string", "null"]
        topic:
          type: ["string", "null"]
        level:
          type: string
        format:
          type: string
        date:
          type: ["string", "null"]
        time:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        capacity:
          type: integer
      required:
        - type
        - title

    CreateVideoBody:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        speaker:
          type: string
        channel:
          type: string
        duration:
          type: string
        category:
          type: string
        description:
          type: string
        isShort:
          type: boolean
        sortOrder:
          type: integer
      required:
        - id
        - title
        - speaker
        - channel
        - duration
        - category
